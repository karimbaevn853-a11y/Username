<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Username & P2P Wheel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.18), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.16), transparent 40%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 14px 96px;
      perspective: 1200px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 12px 14px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-3d-icon {
      width: 40px; height: 40px; border-radius: 13px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.4);
    }
    .brand small { display: block; font-size: 11px; color: var(--muted); }

    .wallet-box {
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.22), rgba(217, 119, 6, 0.12));
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 14px;
      padding: 8px 12px;
      text-align: right;
    }
    .wallet-label { font-size: 10px; color: #fde68a; text-transform: uppercase; }
    .wallet-val { font-size: 14px; font-weight: 800; color: var(--gold); }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .nav-btn {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 4px solid #060a13;
      color: var(--muted);
      padding: 10px 6px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease;
    }
    .nav-btn:active { transform: translateY(3px); border-bottom-width: 1px; }
    .nav-btn.active {
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      color: #fff;
      border-color: rgba(147, 197, 253, 0.5);
      border-bottom-color: #1d4ed8;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, #131c2e, #0c1220);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .sub-filters { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
    .chip {
      background: linear-gradient(180deg, #1e293b, #111827);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 3px solid #090d16;
      padding: 8px 13px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active {
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      color: #0f172a;
      border-bottom-color: #64748b;
    }

    .wheel-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-bottom: 5px solid #060a13;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .wheel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .wheel-header h2 { font-size: 16px; font-weight: 800; }
    .pot-pill {
      background: rgba(251, 191, 36, 0.18);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: var(--gold);
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
    }

    .wheel-stage {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 8px auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 26px solid #ef4444;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.7));
    }

    .wheel-3d {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.25);
      box-shadow:
        0 18px 30px rgba(0, 0, 0, 0.75),
        0 0 0 4px rgba(59, 130, 246, 0.35),
        inset 0 0 22px rgba(0, 0, 0, 0.65);
      transition: transform 4.2s cubic-bezier(0.14, 0.88, 0.18, 1);
      position: relative;
      transform: rotateX(12deg) rotateZ(0deg);
    }

    .wheel-center {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e293b, #020617);
      border: 3px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: var(--gold);
      z-index: 15;
    }

    .bet-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .bet-row input {
      flex: 1;
      min-width: 110px;
      padding: 11px 12px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #090e1a;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .players-list { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 14, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 13px;
      padding: 9px 12px;
      font-size: 12px;
    }

    .color-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .card-3d {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 4px solid rgba(2, 6, 23, 0.9);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .card-body { flex: 1; min-width: 0; }
    .card-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 5px; }
    .uname { font-size: 16px; font-weight: 800; }
    .desc { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .meta { font-size: 11px; color: #cbd5e1; opacity: 0.85; }

    .badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 9px; }
    .b-nft { background: rgba(168, 85, 247, 0.22); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.4); }
    .b-std { background: rgba(59, 130, 246, 0.22); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.4); }
    .b-auc { background: rgba(16, 185, 129, 0.22); color: #a7f3d0; border: 1px solid rgba(16, 185, 129, 0.4); }
    .b-lock { background: rgba(239, 68, 68, 0.22); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.4); }

    .actions-col { display: flex; flex-direction: column; gap: 6px; }
    .btn-3d {
      border: none; border-radius: 13px; padding: 9px 12px;
      font-size: 12px; font-weight: 800; cursor: pointer; color: #fff;
      transition: transform 0.12s ease; white-space: nowrap;
    }
    .btn-3d:active { transform: translateY(2px); }
    .btn-gold { background: linear-gradient(180deg, #fbbf24, #d97706); border-bottom: 3px solid #92400e; }
    .btn-green { background: linear-gradient(180deg, #10b981, #059669); border-bottom: 3px solid #065f46; }
    .btn-blue { background: linear-gradient(180deg, #3b82f6, #2563eb); border-bottom: 3px solid #1e40af; }
    .btn-red { background: linear-gradient(180deg, #ef4444, #b91c1c); border-bottom: 3px solid #7f1d1d; }

    .fab-3d {
      position: fixed; bottom: 16px; left: 14px; right: 14px;
      background: linear-gradient(180deg, #6366f1, #4338ca);
      border: 1px solid rgba(199, 210, 254, 0.35);
      border-bottom: 4px solid #312e81;
      color: #fff; padding: 14px; border-radius: 16px;
      font-size: 15px; font-weight: 800; cursor: pointer; z-index: 40;
    }

    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(2, 6, 23, 0.82); backdrop-filter: blur(5px);
      align-items: center; justify-content: center; padding: 16px; z-index: 100;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: 100%; max-width: 410px;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 5px solid #050811;
      border-radius: 22px; padding: 20px;
    }
    .modal-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #090e1a; color: #fff; font-size: 14px; outline: none;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .modal-actions button { flex: 1; }

    .empty {
      text-align: center; color: var(--muted); padding: 30px 12px;
      font-size: 13px; background: rgba(15, 23, 42, 0.5);
      border-radius: 18px; border: 1px dashed rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <div class="brand-3d-icon">💠</div>
      <div>
        <small id="userBadge">ID: 999001 • Stars</small>
      </div>
    </div>
    <div class="wallet-box" onclick="topUpStars()" style="cursor:pointer;">
      <div class="wallet-label">Баланс (+ Stars)</div>
      <div class="wallet-val">⭐ <span id="walletBalance">0</span></div>
    </div>
  </div>

  <div class="nav-grid">
    <button id="tab-market" class="nav-btn active" onclick="switchTab('market')">🛒 Маркет</button>
    <button id="tab-auction" class="nav-btn" onclick="switchTab('auction')">🔥 Аукцион</button>
    <button id="tab-inventory" class="nav-btn" onclick="switchTab('inventory')">🎒 Инвентарь</button>
    <button id="tab-p2p" class="nav-btn" onclick="switchTab('p2p')">🎡 P2P Бой</button>
  </div>

  <input id="searchBox" class="search-input" type="text" placeholder="Поиск @username..." oninput="render()" />

  <div id="marketSubFilters" class="sub-filters">
    <button class="chip active" onclick="setMarketFilter('all', this)">Все</button>
    <button class="chip" onclick="setMarketFilter('nft', this)">🔮 NFT юзернеймы</button>
    <button class="chip" onclick="setMarketFilter('non_nft', this)">🔹 Без NFT</button>
  </div>

  <div id="p2pWheelSection" style="display:none;">
    <div class="wheel-card">
      <div class="wheel-header">
        <h2>🎡 P2P Барабан (95% приз)</h2>
        <span class="pot-pill">Банк: ⭐ <span id="wheelPot">0</span></span>
      </div>

      <div class="wheel-stage">
        <div class="wheel-pointer"></div>
        <div id="wheel3d" class="wheel-3d"></div>
        <div class="wheel-center">95%</div>
      </div>

      <div class="bet-row">
        <input id="p2pBetInput" type="number" min="1" placeholder="Ставка в ⭐ (напр. 1, 2...)" />
        <button class="btn-3d btn-gold" onclick="placeP2PBet()">Поставить ⭐</button>
        <button class="btn-3d btn-blue" onclick="addDemoOpponent()">+ Игрок</button>
        <button class="btn-3d btn-green" onclick="spinWheel()">Крутить</button>
      </div>

      <div class="meta" style="margin-bottom:6px;">
        Шанс = (Ваши ⭐ / Все ⭐) × 100%. Победитель получает 95%, платформа — 5%.
      </div>

      <div id="wheelPlayers" class="players-list"></div>
    </div>
  </div>

  <div id="listContainer" class="list"></div>

  <button class="fab-3d" onclick="openAddModal()">+ Добавить / Выставить @username</button>

  <div id="addModal" class="modal">
    <div class="modal-card">
      <h2>Новый @username</h2>
      <div class="field">
        <label>Куда добавить</label>
        <select id="addTarget" onchange="toggleAddFields()">
          <option value="inventory">В мой Инвентарь</option>
          <option value="market">Сразу в Маркет</option>
          <option value="auction">Сразу на Аукцион (заблокирует покупку в маркете)</option>
        </select>
      </div>
      <div class="field">
        <label>Тип юзернейма</label>
        <select id="addIsNft">
          <option value="true">🔮 NFT юзернейм (владелец может снять в любой момент)</option>
          <option value="false">🔹 Обычный (Без NFT)</option>
        </select>
      </div>
      <div class="field">
        <label>Юзернейм (начинается с @)</label>
        <input id="addUsername" type="text" placeholder="@example" />
      </div>
      <div class="field" id="addPriceWrap" style="display:none;">
        <label id="addPriceLabel">Цена (Stars ⭐)</label>
        <input id="addPrice" type="number" min="1" placeholder="100" />
      </div>
      <div class="field">
        <label>Описание</label>
        <input id="addDesc" type="text" placeholder="Краткое описание" />
      </div>
      <div class="modal-actions">
        <button class="btn-3d btn-red" onclick="closeModal('addModal')">Отмена</button>
        <button class="btn-3d btn-blue" onclick="submitNewUsername()">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="bidModal" class="modal">
    <div class="modal-card">
      <h2 id="bidModalTitle">Ставка на аукционе</h2>
      <p id="bidModalDesc" class="desc" style="margin-bottom:10px;"></p>
      <div class="field">
        <label>Ваша ставка (Stars ⭐)</label>
        <input id="bidInput" type="number" />
      </div>
      <div class="modal-actions">
        <button class="btn-3d btn-red" onclick="closeModal('bidModal')">Отмена</button>
        <button class="btn-3d btn-green" onclick="submitBid()">Сделать ставку ⭐</button>
      </div>
    </div>
  </div>

  <div id="invSellModal" class="modal">
    <div class="modal-card">
      <h2 id="invSellTitle">Действие с юзернеймом</h2>
      <div class="field">
        <label>Режим</label>
        <select id="invMode">
          <option value="market">Продать в Маркете</option>
          <option value="auction">Выставить на Аукцион</option>
        </select>
      </div>
      <div class="field">
        <label>Цена / Стартовая ставка (Stars ⭐)</label>
        <input id="invPrice" type="number" min="1" placeholder="100" />
      </div>
      <div class="modal-actions">
        <button class="btn-3d btn-red" onclick="closeModal('invSellModal')">Отмена</button>
        <button class="btn-3d btn-gold" onclick="confirmInventoryAction()">Подтвердить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const currentUser = tg.initDataUnsafe?.user || { id: 999001, first_name: "Player", username: "player" };
    document.getElementById("userBadge").innerText = `ID: ${currentUser.id} • Stars`;

    const STORAGE_KEY = `miniapp_stars_state_${currentUser.id}`;
    const WHEEL_COLORS = ["#3b82f6", "#10b981", "#f59e0b", "#a855f7", "#ef4444", "#06b6d4"];

    let activeTab = "market";
    let marketFilter = "all";
    let activeAuctionId = null;
    let activeInvUsername = null;
    let currentRotation = 0;
    let isSpinning = false;

    let state = {
      balance: 250,
      market: [],
      auctions: [],
      inventory: [],
      wheelEntries: []
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            balance: typeof parsed.balance === "number" ? parsed.balance : 250,
            market: Array.isArray(parsed.market) ? parsed.market : [],
            auctions: Array.isArray(parsed.auctions) ? parsed.auctions : [],
            inventory: Array.isArray(parsed.inventory) ? parsed.inventory : [],
            wheelEntries: Array.isArray(parsed.wheelEntries) ? parsed.wheelEntries : []
          };
        }
      } catch (e) {}
      document.getElementById("walletBalance").innerText = state.balance;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.getElementById("walletBalance").innerText = state.balance;
    }

    function topUpStars() {
      state.balance += 100;
      saveState();
      tg.showAlert("+100 ⭐ добавлено на ваш баланс!");
    }

    function spendFromBalance(amount) {
      if (state.balance < amount) {
        tg.showAlert(`Недостаточно Stars! Нужно ${amount} ⭐, на балансе ${state.balance} ⭐.`);
        return false;
      }
      state.balance -= amount;
      saveState();
      return true;
    }

    function switchTab(tab) {
      activeTab = tab;
      ["market", "auction", "inventory", "p2p"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle("active", t === tab);
      });
      document.getElementById("marketSubFilters").style.display = tab === "market" ? "flex" : "none";
      document.getElementById("p2pWheelSection").style.display = tab === "p2p" ? "block" : "none";
      document.getElementById("searchBox").style.display = tab === "p2p" ? "none" : "block";
      render();
    }

    function setMarketFilter(filter, btn) {
      marketFilter = filter;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    function getWheelSegments() {
      const totalStars = state.wheelEntries.reduce((acc, e) => acc + Number(e.stars || 0), 0);
      if (totalStars <= 0) return { totalStars: 0, segments: [] };

      let cursorDeg = 0;
      const segments = state.wheelEntries.map((entry, idx) => {
        const stars = Number(entry.stars || 0);
        const share = stars / totalStars;
        const pct = Math.round(share * 1000) / 10;
        const deg = share * 360;
        const startDeg = cursorDeg;
        const endDeg = cursorDeg + deg;
        cursorDeg = endDeg;
        return {
          ...entry,
          stars,
          pct,
          startDeg,
          endDeg,
          color: WHEEL_COLORS[idx % WHEEL_COLORS.length]
        };
      });

      return { totalStars, segments };
    }

    function renderWheel() {
      const { totalStars, segments } = getWheelSegments();
      document.getElementById("wheelPot").innerText = totalStars;

      const wheelEl = document.getElementById("wheel3d");
      if (!segments.length) {
        wheelEl.style.background = "conic-gradient(#1e293b 0deg 360deg)";
      } else {
        const gradParts = segments.map(s => `${s.color} ${s.startDeg}deg ${s.endDeg}deg`);
        wheelEl.style.background = `conic-gradient(${gradParts.join(", ")})`;
      }

      const listEl = document.getElementById("wheelPlayers");
      if (!segments.length) {
        listEl.innerHTML = `<div class="empty">Ставок пока нет. Поставьте ⭐ или добавьте соперника.</div>`;
        return;
      }

      listEl.innerHTML = segments.map((s, i) => `
        <div class="player-item">
          <div>
            <span class="color-dot" style="background:${s.color};"></span>
            <b>#${i + 1} ${s.name}</b>
          </div>
          <div>
            <b>${s.stars} ⭐</b> • <span style="color:#93c5fd;">${s.pct}%</span>
          </div>
        </div>
      `).join("");
    }

    function placeP2PBet() {
      if (isSpinning) return;
      const stake = parseInt(document.getElementById("p2pBetInput").value, 10);
      if (!stake || stake <= 0) {
        tg.showAlert("Введите ставку в Stars ⭐");
        return;
      }
      if (!spendFromBalance(stake)) return;

      const existing = state.wheelEntries.find(e => Number(e.user_id) === Number(currentUser.id));
      if (existing) {
        existing.stars += stake;
      } else {
        state.wheelEntries.push({
          user_id: currentUser.id,
          name: currentUser.first_name || "You",
          stars: stake
        });
      }

      document.getElementById("p2pBetInput").value = "";
      saveState();
      renderWheel();
    }

    function addDemoOpponent() {
      if (isSpinning) return;
      const stake = parseInt(document.getElementById("p2pBetInput").value, 10) || 1;
      const idx = state.wheelEntries.length + 1;
      state.wheelEntries.push({
        user_id: 500000 + Date.now() % 100000,
        name: `Игрок_${idx}`,
        stars: stake
      });
      saveState();
      renderWheel();
    }

    function spinWheel() {
      if (isSpinning) return;
      const { totalStars, segments } = getWheelSegments();
      if (segments.length < 2 || totalStars <= 0) {
        tg.showAlert("Нужно минимум 2 участника в барабане!");
        return;
      }

      isSpinning = true;
      const roll = Math.random() * totalStars;
      let acc = 0;
      let winner = segments[segments.length - 1];
      for (const seg of segments) {
        acc += seg.stars;
        if (roll <= acc) {
          winner = seg;
          break;
        }
      }

      const prize = Math.max(1, Math.floor(totalStars * 0.95));
      const targetAngle = (winner.startDeg + winner.endDeg) / 2;
      currentRotation = currentRotation + 360 * 5 + (360 - targetAngle);

      const wheelEl = document.getElementById("wheel3d");
      wheelEl.style.transform = `rotateX(12deg) rotateZ(${currentRotation}deg)`;

      setTimeout(() => {
        if (Number(winner.user_id) === Number(currentUser.id)) {
          state.balance += prize;
        }
        state.wheelEntries = [];
        saveState();
        isSpinning = false;
        renderWheel();
        tg.showAlert(`🎉 Язычок барабана указал на ${winner.name} (${winner.pct}%)! Выигрыш: ${prize} ⭐ (95%, комиссия 5%).`);
      }, 4300);
    }

    function buyMarketItemById(id) {
      const item = state.market.find(m => m.id === id);
      if (!item) return;
      if (item.on_auction) {
        tg.showAlert("Этот юзернейм на аукционе — покупка в маркете заблокирована!");
        return;
      }
      if (!spendFromBalance(item.price)) return;

      state.market = state.market.filter(m => m.id !== id);
      state.inventory.unshift({
        username: item.username,
        is_nft: item.is_nft,
        desc: item.desc
      });
      saveState();
      render();
      tg.showAlert(`Куплено ${item.username}! Юзернейм перешёл в Инвентарь.`);
    }

    function removeNftById(id) {
      const idx = state.market.findIndex(m => m.id === id);
      if (idx < 0) return;
      const item = state.market[idx];
      if (!item.is_nft || Number(item.owner_id) !== Number(currentUser.id)) return;

      state.market.splice(idx, 1);
      state.inventory.unshift({
        username: item.username,
        is_nft: true,
        desc: item.desc
      });
      saveState();
      render();
      tg.showAlert(`NFT ${item.username} снят с маркета и возвращён в Инвентарь.`);
    }

    function openBidModal(auctionId) {
      const lot = state.auctions.find(a => a.id === auctionId);
      if (!lot) return;
      activeAuctionId = auctionId;
      const minBid = lot.current_bid + (lot.min_step || 50);
      document.getElementById("bidModalTitle").innerText = `Ставка: ${lot.username}`;
      document.getElementById("bidModalDesc").innerText = `Текущая ставка: ${lot.current_bid} ⭐ • Минимум: ${minBid} ⭐`;
      const inp = document.getElementById("bidInput");
      inp.value = minBid;
      inp.min = minBid;
      document.getElementById("bidModal").classList.add("open");
    }

    function submitBid() {
      const lot = state.auctions.find(a => a.id === activeAuctionId);
      if (!lot) return;
      const amount = parseInt(document.getElementById("bidInput").value, 10);
      const minBid = lot.current_bid + (lot.min_step || 50);
      if (!amount || amount < minBid) {
        tg.showAlert(`Минимальная ставка: ${minBid} ⭐`);
        return;
      }
      if (!spendFromBalance(amount)) return;

      lot.current_bid = amount;
      lot.bids_count = (lot.bids_count || 0) + 1;
      closeModal("bidModal");
      saveState();
      render();
      tg.showAlert(`Ставка ${amount} ⭐ на ${lot.username} принята!`);
    }

    function openInvSellModal(username) {
      activeInvUsername = username;
      document.getElementById("invSellTitle").innerText = `Управление ${username}`;
      document.getElementById("invPrice").value = "";
      document.getElementById("invSellModal").classList.add("open");
    }

    function confirmInventoryAction() {
      const mode = document.getElementById("invMode").value;
      const price = parseInt(document.getElementById("invPrice").value, 10);
      if (!price || price <= 0) {
        tg.showAlert("Укажите сумму в Stars ⭐");
        return;
      }

      const idx = state.inventory.findIndex(i => i.username === activeInvUsername);
      if (idx < 0) return;
      const item = state.inventory.splice(idx, 1)[0];

      if (mode === "auction") {
        state.market.forEach(m => { if (m.username === item.username) m.on_auction = true; });
        state.auctions.unshift({
          id: Date.now(),
          username: item.username,
          current_bid: price,
          min_step: 50,
          is_nft: item.is_nft,
          owner_id: currentUser.id,
          bids_count: 0,
          desc: item.desc
        });
      } else {
        state.market.unshift({
          id: Date.now(),
          username: item.username,
          price,
          is_nft: item.is_nft,
          owner_id: currentUser.id,
          on_auction: false,
          desc: item.desc
        });
      }

      closeModal("invSellModal");
      saveState();
      render();
    }

    function openAddModal() {
      document.getElementById("addModal").classList.add("open");
      toggleAddFields();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function toggleAddFields() {
      const target = document.getElementById("addTarget").value;
      document.getElementById("addPriceWrap").style.display = target === "inventory" ? "none" : "block";
      document.getElementById("addPriceLabel").innerText = target === "auction"
        ? "Стартовая ставка (Stars ⭐)"
        : "Цена продажи (Stars ⭐)";
    }

    function submitNewUsername() {
      const target = document.getElementById("addTarget").value;
      const isNft = document.getElementById("addIsNft").value === "true";
      const username = document.getElementById("addUsername").value.trim();
      const price = parseInt(document.getElementById("addPrice").value, 10) || 0;
      const desc = document.getElementById("addDesc").value.trim() || (isNft ? "NFT юзернейм" : "Обычный юзернейм");

      if (!username.startsWith("@") || username.length < 2) {
        tg.showAlert("Введите @username");
        return;
      }
      if (target !== "inventory" && price <= 0) {
        tg.showAlert("Введите сумму в Stars ⭐");
        return;
      }

      if (target === "inventory") {
        state.inventory.unshift({ username, is_nft: isNft, desc });
        switchTab("inventory");
      } else if (target === "market") {
        state.market.unshift({
          id: Date.now(),
          username,
          price,
          is_nft: isNft,
          owner_id: currentUser.id,
          on_auction: false,
          desc
        });
        switchTab("market");
      } else {
        state.market.forEach(m => { if (m.username === username) m.on_auction = true; });
        state.auctions.unshift({
          id: Date.now(),
          username,
          current_bid: price,
          min_step: 50,
          is_nft: isNft,
          owner_id: currentUser.id,
          bids_count: 0,
          desc
        });
        switchTab("auction");
      }

      closeModal("addModal");
      document.getElementById("addUsername").value = "";
      document.getElementById("addPrice").value = "";
      document.getElementById("addDesc").value = "";
      saveState();
      render();
    }

    function render() {
      if (activeTab === "p2p") {
        document.getElementById("listContainer").innerHTML = "";
        renderWheel();
        return;
      }

      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const container = document.getElementById("listContainer");
      container.innerHTML = "";

      if (activeTab === "market") {
        const items = state.market.filter(m => {
          const matchQ = m.username.toLowerCase().includes(q) || (m.desc || "").toLowerCase().includes(q);
          if (!matchQ) return false;
          if (marketFilter === "nft") return Boolean(m.is_nft);
          if (marketFilter === "non_nft") return !m.is_nft;
          return true;
        });

        if (!items.length) {
          container.innerHTML = `<div class="empty">В Маркете пока пусто.</div>`;
          return;
        }

        items.forEach(item => {
          const isOwner = Number(item.owner_id) === Number(currentUser.id);
          const typeBadge = item.is_nft
            ? `<span class="badge b-nft">🔮 NFT</span>`
            : `<span class="badge b-std">🔹 БЕЗ NFT</span>`;
          const aucBadge = item.on_auction
            ? `<span class="badge b-lock">🔒 НА АУКЦИОНЕ</span>`
            : ``;

          const card = document.createElement("div");
          card.className = "card-3d";
          card.innerHTML = `
            <div class="card-body">
              <div class="card-head">
                <span class="uname">${item.username}</span>
                ${typeBadge}
                ${aucBadge}
              </div>
              <div class="desc">${item.desc || ""}</div>
              <div class="meta">Владелец ID: ${item.owner_id}</div>
            </div>
            <div class="actions-col">
              ${item.on_auction
                ? `<button class="btn-3d btn-red" disabled>На аукционе</button>`
                : `<button class="btn-3d btn-gold" onclick="buyMarketItemById(${item.id})">Купить ⭐ ${item.price}</button>`
              }
              ${(item.is_nft && isOwner)
                ? `<button class="btn-3d btn-red" onclick="removeNftById(${item.id})">Снять NFT</button>`
                : ``
              }
            </div>
          `;
          container.appendChild(card);
        });
      } else if (activeTab === "auction") {
        const items = state.auctions.filter(a =>
          a.username.toLowerCase().includes(q) || (a.desc || "").toLowerCase().includes(q)
        );

        if (!items.length) {
          container.innerHTML = `<div class="empty">Активных аукционов нет.</div>`;
          return;
        }

        items.forEach(lot => {
          const typeBadge = lot.is_nft
            ? `<span class="badge b-nft">🔮 NFT</span>`
            : `<span class="badge b-std">🔹 БЕЗ NFT</span>`;

          const card = document.createElement("div");
          card.className = "card-3d";
          card.innerHTML = `
            <div class="card-body">
              <div class="card-head">
                <span class="uname">${lot.username}</span>
                ${typeBadge}
                <span class="badge b-auc">🔥 АУКЦИОН</span>
              </div>
              <div class="desc">${lot.desc || ""}</div>
              <div class="meta">Ставок: ${lot.bids_count || 0} • В маркете закрыто</div>
            </div>
            <div class="actions-col">
              <button class="btn-3d btn-green" onclick="openBidModal(${lot.id})">Ставка ⭐ ${lot.current_bid}</button>
            </div>
          `;
          container.appendChild(card);
        });
      } else if (activeTab === "inventory") {
        const items = state.inventory.filter(i =>
          i.username.toLowerCase().includes(q) || (i.desc || "").toLowerCase().includes(q)
        );

        if (!items.length) {
          container.innerHTML = `<div class="empty">Инвентарь пуст.</div>`;
          return;
        }

        items.forEach(item => {
          const typeBadge = item.is_nft
            ? `<span class="badge b-nft">🔮 NFT</span>`
            : `<span class="badge b-std">🔹 БЕЗ NFT</span>`;

          const card = document.createElement("div");
          card.className = "card-3d";
          card.innerHTML = `
            <div class="card-body">
              <div class="card-head">
                <span class="uname">${item.username}</span>
                ${typeBadge}
              </div>
              <div class="desc">${item.desc || ""}</div>
              <div class="meta">Доступно для продажи или аукциона</div>
            </div>
            <div class="actions-col">
              <button class="btn-3d btn-blue" onclick="openInvSellModal('${item.username}')">Продать / Аукцион</button>
            </div>
          `;
          container.appendChild(card);
        });
      }
    }

    loadState();
    render();
  </script>
</body>
</html>
